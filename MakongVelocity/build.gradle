plugins {
    id 'java'
}

group = 'com.angkor'
version = '1.3.3'

description = 'Velocity companion for MakongCore - forwards nLogin account types to backends, relays network-wide restart broadcasts through the Makong Network website bridge, and runs periodic store/Discord announcements.'

repositories {
    maven { name = 'papermc'; url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:3.4.0'
    annotationProcessor 'com.velocitypowered:velocity-api:3.4.0'
    // Public API classes only, extracted from the real nLogin-2.0.19.jar the
    // server actually runs - nLogin itself is provided at runtime by the
    // Velocity proxy, this is compile-time only. See README.md.
    compileOnly files('libs/nlogin-api-2.0.19.jar')
    // Velocity already bundles Adventure itself at runtime (Component, Key,
    // etc. all come from velocity-api's own transitive dependency) but not
    // this specific serializer module, so it needs the same compileOnly
    // treatment as velocity-api - the real proxy supplies a matching
    // implementation at runtime.
    compileOnly 'net.kyori:adventure-text-serializer-legacy:4.17.0'
    // Velocity has no YAML library on its classpath at all (unlike
    // Paper/Spigot), so unlike everything else above this one actually has
    // to be bundled into the jar - see the fat-jar block below.
    implementation 'org.yaml:snakeyaml:2.4'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Bundles the one runtime dependency (SnakeYAML) directly into the plugin
// jar, the same manual approach MakongCore/build.gradle uses for its own
// runtime deps - no Shadow plugin needed for a single small dependency.
tasks.named('jar', Jar).configure {
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(configurations.runtimeClasspath.collect { file -> zipTree(file) })
    manifest {
        attributes(
            'Implementation-Title': 'MakongVelocity',
            'Implementation-Version': project.version
        )
    }
}
tasks.named('build') {
    dependsOn(tasks.named('jar'))
}
