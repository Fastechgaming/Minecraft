name: Build MakongCore Plugins

# Builds the MakongCore (Paper) and MakongVelocity plugin jars on GitHub's
# own runners - avoids relying on a phone's mobile network to fetch Paper
# API/HikariCP/H2/mysql-connector-j/JDA/Velocity API from Maven, which is
# what made Termux builds flaky. Each jar is attached to the workflow run as
# a separately downloadable artifact.
on:
  push:
    paths:
      - "MakongCore/**"
      - "MakongVelocity/**"
      - ".github/workflows/build-makongcore.yml"
  workflow_dispatch: {}

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build with Gradle
        working-directory: MakongCore
        run: ./gradlew clean build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MakongCore-jar
          path: MakongCore/build/libs/*.jar
          if-no-files-found: error

  build-velocity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build with Gradle
        working-directory: MakongVelocity
        run: ./gradlew clean build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MakongVelocity-jar
          path: MakongVelocity/build/libs/*.jar
          if-no-files-found: error
