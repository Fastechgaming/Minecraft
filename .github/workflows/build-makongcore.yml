name: Build MakongCore Plugin

# Builds the MakongCore Paper plugin jar on GitHub's own runners - avoids
# relying on a phone's mobile network to fetch Paper API/HikariCP/H2/
# mysql-connector-j/JDA from Maven, which is what made Termux builds flaky.
# The finished jar is attached to the workflow run as a downloadable artifact.
on:
  push:
    paths:
      - "MakongCore/**"
      - ".github/workflows/build-makongcore.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build with Gradle
        working-directory: MakongCore
        run: ./gradlew clean build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MakongCore-jar
          path: MakongCore/build/libs/*.jar
          if-no-files-found: error
