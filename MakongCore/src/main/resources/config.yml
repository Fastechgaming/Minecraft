# MakongCore main configuration
# INFO: Keep this file for plugin-wide/core settings only.
# INFO: Team gameplay belongs in module/team.yml.
# INFO: Player MaTier belongs in module/matier.yml.
# INFO: GUI layout belongs in gui.yml and messages belong in messages.yml.

# INFO: Database/storage configuration shared by MakongCore modules.
storage:
  # INFO: Database type. Use h2 for a single server or mysql for a network.
  type: h2
  # INFO: MySQL connection settings. Required when type is mysql.
  mysql:
    host: localhost
    port: 3306
    database: makongcore
    username: root
    password: ""
    use_ssl: false
    connection_timeout: 10000
    max_pool_size: 8
    min_idle: 1

# INFO: Network-wide mode. Keep false when multiple servers share MySQL.
network:
  enabled: false
  server_id: smp

# Website Bridge
# INFO: Connects this server to the Makong Network website's multi-server
# INFO: command bridge (see ../MakongWeb/lib/pluginBridge.js). This server
# INFO: dials out to the website on a repeating timer - nothing needs to be
# INFO: opened on this server's side, and it works the same whether the
# INFO: website and this server share a box or sit on entirely different hosts.
website:
  # INFO: Turn the bridge on. Leave false (or leave url/secret unset below)
  # INFO: and nothing about this plugin changes.
  enabled: false
  # INFO: Public URL of the website (its own SITE_URL).
  url: "https://makongmc.com"
  # INFO: Must match MAKONGCORE_SECRET in the website's .env exactly.
  secret: "change-me"
  # INFO: A short id for this server, shown on the website's /admin/servers
  # INFO: page and used by /mateam ping <server-id>. Leave blank to reuse
  # INFO: network.server_id above.
  server_id: ""
  # INFO: How often (in seconds) to check the website for new commands/pings
  # INFO: and report this server's Team/MaTier Star standings. Lower is more
  # INFO: responsive (e.g. /mc clients on the Velocity companion detects a
  # INFO: reconnect sooner) at the cost of a bit more background traffic;
  # INFO: there's little reason to go below 2.
  poll_interval_seconds: 3

# INFO: Developer diagnostics. Enable only when troubleshooting.
debug: false
