name: MakongCore
version: ${version}
main: com.angkor.makongcore.MakongCore
api-version: '1.21'
author: Angkor
softdepend: [floodgate, PlaceholderAPI]
commands:
  team:
    description: Open and manage your team
    usage: /team [...]
    aliases: [teams]
  mateam:
    description: Team admin commands (team module only)
    usage: /mateam <help|team|disband|forcejoin|forceleave|addpoints|setpoints|addstars|setstars>
  makongcore:
    description: MakongCore global administration - all modules
    usage: /makongcore <help|reload|info|list|ping|autorestart|matier ...|team|disband|forcejoin|forceleave|addpoints|setpoints|addstars|setstars>
    aliases: [macore]
  matier:
    description: Player MaTier profile and leaderboard
    usage: /matier [top|stats|set|add|remove|reset|resetall|reload]
  link:
    description: Link your Minecraft account to Discord
    usage: /link
permissions:
  mateam.use:
    default: true
  mateam.admin:
    description: Access /mateam's team-administration commands
    default: op
  makongcore.admin:
    description: Access /matier's admin subcommands, and /makongcore's (/macore's) global admin commands
    default: op
