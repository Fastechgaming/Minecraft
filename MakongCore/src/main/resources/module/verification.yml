# Account verification - cracked-player Discord/Telegram linking, premium
# detection, and the Discord staff commands that ride along with it.
# INFO: Keep bot tokens private. Never publish them or commit them to Git.
#
# ================================================================
# QUICK REFERENCE - what to configure where, on a multi-server network
# sharing one Discord bot (a single-server setup can ignore this and just
# fill everything in once):
#
#   EVERY SERVER (set the same everywhere):
#     discord.enabled, discord.invite, telegram.* (but only actually
#     ENABLE Telegram on one server - see the note by telegram.enabled),
#     everything under linking.*
#
#   HUB SERVER ONLY (the one server with discord.hub: true - every other
#   server never reads these at all, so just leave them as shipped):
#     discord.hub, discord.bot_token, discord.guild.*,
#     discord.verification.*, discord.roles.*, discord.commands.*,
#     discord.profile.*
#
# Why: only the hub server ever opens a live connection to Discord, so
# only it ever receives a slash command, button click, or modal submit -
# everything in the "hub only" list is exclusively read from inside
# those. discord.enabled itself is the one exception living in the
# discord: block below - it controls /verify and the cracked-player
# freeze locally on THIS server, independent of who holds the connection.
# ================================================================

discord:
  # ---- every server ----
  enabled: false
  invite: "discord.gg/makong"

  # ---- hub server only (below this line) ----
  # INFO: If MULTIPLE servers share this same bot_token (a network with one
  # INFO: bot for all servers), only ONE of them should actually open a
  # INFO: connection to Discord - otherwise every connected server receives
  # INFO: every button click/modal submit at once and races the others to
  # INFO: reply, producing "10062 Unknown interaction" / "40060 already
  # INFO: acknowledged" errors in the console. Set hub: true on exactly ONE
  # INFO: server (its config already carries a real channel_id/panel below)
  # INFO: and hub: false everywhere else. discord.enabled above stays true
  # INFO: on every server regardless - it controls whether linking is
  # INFO: required/available and whether /verify works, not the connection;
  # INFO: a player on a non-hub server still gets a code via /verify, and it's
  # INFO: still recognized correctly when they submit it through the hub's
  # INFO: bot, via the shared database. On a single-server setup (the
  # INFO: default), leave this alone.
  hub: true
  bot_token: "PUT_DISCORD_BOT_TOKEN_HERE"
  guild:
    id: ""
    required: true
    required_role_id: ""
    # INFO: A Discord account may verify if it satisfies AT LEAST ONE of
    # INFO: these tiers - each tier needs BOTH its account-age AND its
    # INFO: guild-membership-age minimum met (both in days; 0 means "no
    # INFO: minimum"). Add, remove, or edit tiers freely; at least one
    # INFO: tier is required or nobody will ever pass.
    # INFO: Shipped defaults: (a) a 6-month-old account that's been in the
    # INFO: guild for a month, or (b) a 1-year-old account regardless of
    # INFO: how recently it joined.
    eligibility_tiers:
      - minimum_account_age_days: 180
        minimum_membership_days: 30
      - minimum_account_age_days: 365
        minimum_membership_days: 0
  # INFO: Alt accounts - lets ONE Discord account link more than one
  # INFO: Minecraft account (a Main plus up to two Alts). This is a
  # INFO: SEPARATE, additive gate on top of eligibility_tiers above:
  # INFO: eligibility_tiers still decides whether a Discord account may
  # INFO: link ANYTHING at all (its "first account"/Main); this decides how
  # INFO: many TOTAL accounts it may have linked once it's already eligible.
  # INFO: The highest tier a Discord account's own age/membership meets
  # INFO: wins - below the first tier's thresholds, only a Main may be
  # INFO: linked (max_accounts effectively 1, no alts) regardless of this
  # INFO: list. /profile shows a dropdown to switch between linked accounts
  # INFO: once there's more than one; /editprofile picks which is Main.
  alts:
    enabled: true
    tiers:
      # 1+ year old account, 3+ months in this Discord -> Main + 1 Alt.
      - minimum_account_age_days: 365
        minimum_membership_days: 90
        max_accounts: 2
      # 2+ years old account, 9+ months in this Discord -> Main + 2 Alts.
      - minimum_account_age_days: 730
        minimum_membership_days: 270
        max_accounts: 3
  verification:
    channel_id: ""
    panel_message_id: ""
  roles:
    crack: ""
    java: ""
    bedrock: ""
  commands:
    # INFO: Discord role IDs allowed to use /ban and /unban. Add as many as
    # INFO: you want - having ANY ONE of these roles is enough (multiple
    # INFO: staff ranks are fine). Empty by default: with nothing configured
    # INFO: here, NOBODY can use these commands - moderation commands stay
    # INFO: locked down until you deliberately grant a role, not open to
    # INFO: every verified player. staff_role_id (singular, below) is the
    # INFO: old pre-list key - still honored if you already had it set, so
    # INFO: upgrading never silently drops an existing setup, but new setups
    # INFO: should use staff_role_ids instead.
    staff_role_ids: []
    staff_role_id: ""
    # INFO: Three-tier permission model for /ban and /unban. A member's
    # INFO: HIGHEST matching role below decides what happens - having a role
    # INFO: in staff_role_ids/staff_role_id above (with nothing set here)
    # INFO: counts as Manager, so an existing pre-3-tier setup keeps working
    # INFO: exactly as before (both commands run immediately, nothing to
    # INFO: accept/deny):
    # INFO:
    # INFO:   Manager      - /ban and /unban both run immediately.
    # INFO:   Helper       - /ban runs immediately; /unban is posted as a
    # INFO:                  request (an embed with Accept/Deny buttons, in
    # INFO:                  the same channel) that only a Manager can decide.
    # INFO:   Trial Helper - both /ban and /unban are always a request:
    # INFO:                  /ban can be Accepted/Denied by a Helper OR a
    # INFO:                  Manager, /unban needs a Manager specifically.
    # INFO:
    # INFO: Each list works the same as staff_role_ids above - any ONE
    # INFO: matching role is enough, multiple ranks per tier are fine.
    roles:
      trial_helper_role_ids: []
      helper_role_ids: []
      manager_role_ids: []
    ban:
      enabled: true
    unban:
      enabled: true
  # INFO: /profile @user - shows a linked player's Makong Network profile
  # INFO: card (Discord embed image) to anyone in the channel: MaTier tier
  # INFO: + Star, Team, account type, and (if the MakongVelocity companion
  # INFO: is connected) whole-network online status and nLogin registration/
  # INFO: last-login. Open to everyone, not staff-gated like ban/unban -
  # INFO: it's read-only. Only works for a Discord account already linked
  # INFO: to a Minecraft account (see /verify).
  profile:
    tagline: "Play. Improve. Be Better."

# ---- every server ----
telegram:
  enabled: false
  # INFO: Unlike discord.hub above, Telegram has no hub flag (yet) - every
  # INFO: server with enabled: true here runs its OWN independent poller
  # INFO: against the same bot_token. On a multi-server network, only turn
  # INFO: this on for ONE server, the same practical rule as discord.hub,
  # INFO: just not enforced by the plugin - two servers both polling would
  # INFO: race each other the same way an un-hubbed Discord bot would.
  bot_token: "PUT_TELEGRAM_BOT_TOKEN_HERE"
  username: "makongmcbot"

# ---- every server ----
linking:
  # INFO: Cracked players must verify with Discord OR Telegram. Only takes
  # INFO: effect when at least one of discord.enabled / telegram.enabled
  # INFO: above is true - with both off, this is ignored (nothing freezes
  # INFO: cracked players, since there'd be no bot for them to verify
  # INFO: through). Set this to false yourself to make linking fully
  # INFO: optional even while a bot is enabled.
  required_for_cracked: true
  code_length: 6
  code_expire_minutes: 10
  # INFO: /verify's own cooldown - running it again within this many seconds
  # INFO: of the last request just re-shows the SAME still-valid code
  # INFO: (doesn't touch its expiry, doesn't roll a new one). Once the
  # INFO: cooldown has elapsed, running /verify again generates a genuinely
  # INFO: new code with a fresh code_expire_minutes window. Doesn't apply to
  # INFO: the required-verification freeze (that's a one-time code per
  # INFO: freeze, not repeatable on demand).
  request_cooldown_seconds: 60
  one_minecraft_per_discord: true
  one_discord_per_minecraft: true
  one_minecraft_per_telegram: true
  one_telegram_per_minecraft: true
  premium_detection:
    enabled: true
    unknown_as_cracked: true
    # INFO: Mojang username lookup is best-effort on offline-mode servers; use an auth plugin for strict premium/cracked detection.
  # INFO: While a player is frozen waiting to verify, this is re-sent on
  # INFO: a repeat - title/subtitle/action bar/chat message, all of it -
  # INFO: since a Minecraft title or action bar fades out on its own
  # INFO: after a few seconds and would otherwise only ever be shown once,
  # INFO: right when the player gets frozen.
  # INFO: {code} / {discord} / {telegram} are replaced in any of the four
  # INFO: lines below - {discord} is discord.invite above, {telegram} is
  # INFO: "@" + telegram.username above.
  reminder:
    interval_seconds: 3
    title: "{code}"
    subtitle: "Send this code to Discord/Telegram to play"
    actionbar: "&bDiscord: {discord} &7| &bTelegram: {telegram}"
    message: "&cYou must link your account to continue. &7Code: &e{code}"
  # INFO: Shown when a player runs /verify (or its /link alias) by choice -
  # INFO: not frozen/required, just asking for a code. Same {code}/{discord}/
  # INFO: {telegram}/&-color convention as reminder above, plus
  # INFO: {expires_minutes} (= code_expire_minutes above).
  verify_command:
    title: "{code}"
    subtitle: "Send this code to Discord/Telegram to link"
    actionbar: "&bDiscord: {discord} &7| &bTelegram: {telegram}"
    message: "&aOptional linking code: &e{code} &7(expires in {expires_minutes}m)"
