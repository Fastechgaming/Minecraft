# Website Bridge
# INFO: Connects this server to the Makong Network website's multi-server
# INFO: command bridge (see ../../MakongWeb/lib/pluginBridge.js). This server
# INFO: dials out to the website on a repeating timer - nothing needs to be
# INFO: opened on this server's side, and it works the same whether the
# INFO: website and this server share a box or sit on entirely different hosts.

website:
  # INFO: Turn the bridge on. Leave false (or leave url/secret unset below)
  # INFO: and nothing about this plugin changes.
  enabled: false
  # INFO: Public URL of the website (its own SITE_URL).
  url: "https://makongmc.com"
  # INFO: Must match MAKONGCORE_SECRET in the website's .env exactly.
  secret: "change-me"
  # INFO: A short id for this server, shown on the website's /admin/servers
  # INFO: page and used by /makongcore ping <server-id>. Leave blank to reuse
  # INFO: config.yml's network.server_id.
  server_id: ""
  # INFO: How often (in seconds) to check the website for new commands/pings.
  poll_interval_seconds: 5
