# MakongCore Team module
# INFO: Everything below controls the /team system.
# INFO: Change these values instead of editing Java code.
team:
  # INFO: Enable/disable the ENTIRE Team module - /team, /mateam, the team
  # INFO: GUI, team chat, team PvP, the annual Star reset, and the
  # INFO: %team_tag%/%team_star% placeholders. Set false on a gamemode
  # INFO: where teams don't make sense (Arcade, Practice, etc.) - /team and
  # INFO: /mateam just reply that teams are disabled instead of running.
  enabled: true
  # INFO: Team size and naming limits.
  limits:
    max_team_size: 36
    min_name_length: 3
    max_name_length: 15
    min_tag_length: 2
    max_tag_length: 5
    max_description_length: 32
  # INFO: Defaults for newly created teams.
  defaults:
    description: "a new team!"
  # INFO: Invitation and join-request expiration.
  invites:
    expire_seconds: 3600
  # INFO: Team PvP toggle.
  pvp:
    enabled: true
    default_status: false
    toggle_cooldown_seconds: 300
  # INFO: Team alliance limits and request behavior.
  allies:
    enabled: true
    max_allies: 10
    allow_request_toggle: true
  # INFO: Team chat prefix settings.
  chat:
    character_enabled: true
    character: "#"
  # INFO: Rename cooldown in seconds.
  rename:
    cooldown_seconds: 604800
  # INFO: Annual reset for team Stars.
  annual_star_reset:
    enabled: true
    month: 1
    day: 1
    hour: 0
    minute: 0
  # INFO: Automatically disband inactive teams.
  disband:
    auto_disband: false
    inactive_days: 15
    check_interval_minutes: 360
  # INFO: Team Stars (added 1.2.35). Real-time, MaTier-style: every kill,
  # INFO: death and hour of playtime awards/deducts Stars straight to the
  # INFO: team the instant it happens - there's no weekly payout cycle.
  # INFO: Every team member also tracks kills, deaths and playtime.
  scoring:
    enabled: true
    minimum_stars: 0
    spam_threshold_seconds: 60
    events:
      playtime_per_hour: 1
      kill: 1
      kill_spam: 0
      death: 0
      death_spam: -1
  # INFO: Team creation validation. These mirror the limits above.
  creation:
    min_tag_length: 2
    max_tag_length: 5
    min_name_length: 3
    max_name_length: 15
  # INFO: PlaceholderAPI display (see MakongCore's README "PlaceholderAPI"
  # INFO: section). Supports MiniMessage color tags.
  placeholders:
    # INFO: What %team_tag% shows for a player who isn't in any team.
    no_team: "<gray>No Team</gray>"
