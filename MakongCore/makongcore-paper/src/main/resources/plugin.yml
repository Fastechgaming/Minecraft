name: MakongCore
main: network.makong.core.paper.MakongCorePlugin
version: '${version}'
api-version: '1.20'
author: Makong Network
description: Connects this server to the Makong Network website's multi-server command bridge.
commands:
  makong:
    description: MakongCore bridge commands.
    usage: /makong <status|ping <server-id>>
    permission: makongcore.admin
permissions:
  makongcore.admin:
    description: Use /makong commands.
    default: op
