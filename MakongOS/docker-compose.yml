version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: makongos
      POSTGRES_PASSWORD: makongos
      POSTGRES_DB: makongos
    volumes:
      - makongos_pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U makongos']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://makongos:makongos@postgres:5432/makongos?schema=public
    ports:
      - '3000:3000'
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  makongos_pgdata:
