name: MakongStore
main: network.makong.store.paper.MakongStorePlugin
version: '${version}'
api-version: '1.20'
author: Makong Network
description: Connects this server to the Makong Network website's multi-server command bridge.
commands:
  makong:
    description: MakongStore bridge commands.
    usage: /makong <status|ping <server-id>>
    permission: makongstore.admin
permissions:
  makongstore.admin:
    description: Use /makong commands.
    default: op
